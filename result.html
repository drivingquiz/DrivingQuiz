<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ئەنجام | Driving Quiz</title>


    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Tahoma, Arial, sans-serif;
            background: radial-gradient( circle at top right, rgba(255, 193, 7, 0.12), transparent 35% ), #06182b;
            min-height: 100vh;
            color: white;
        }



        /* =========================
           HEADER
        ========================= */

        .top-header {
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            background: rgba(5, 20, 36, 0.95);
            border-bottom: 1px solid rgba(255, 193, 7, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }


        .brand-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: #ffc107;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.25);
        }


        .brand h1 {
            font-size: 25px;
            color: #ffc107;
        }


        .brand p {
            font-size: 13px;
            color: #aeb8c3;
            margin-top: 3px;
        }



        /* =========================
           RESULT AREA
        ========================= */

        .result-wrapper {
            min-height: calc(100vh - 82px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }



        /* =========================
           RESULT CARD
        ========================= */

        .result-card {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.98);
            color: #06182b;
            border-radius: 32px;
            padding: 45px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }


            .result-card::before {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 100%;
                height: 5px;
                background: #ffc107;
            }



        /* =========================
           TROPHY
        ========================= */

        .trophy {
            width: 105px;
            height: 105px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: linear-gradient( 145deg, #fff7d6, #ffe48a );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            box-shadow: 0 12px 35px rgba(255, 193, 7, 0.28);
        }



        /* =========================
           TITLE
        ========================= */

        .main-title {
            text-align: center;
            font-size: 31px;
            margin-bottom: 8px;
            color: #06182b;
        }


        .subtitle {
            text-align: center;
            color: #707983;
            font-size: 17px;
            margin-bottom: 32px;
        }



        /* =========================
           SCORE
        ========================= */

        .main-score {
            background: linear-gradient( 135deg, #06182b, #0c2945 );
            border-radius: 25px;
            padding: 28px;
            text-align: center;
            color: white;
            margin-bottom: 22px;
            box-shadow: 0 15px 35px rgba(6, 24, 43, 0.22);
        }


        .score-label {
            color: #ffc107;
            font-size: 18px;
            margin-bottom: 8px;
        }


        .score {
            font-size: 68px;
            line-height: 1;
            font-weight: bold;
            color: #ffc107;
        }


            .score span {
                color: white;
                font-size: 34px;
            }



        /* =========================
           INFO
        ========================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 28px;
        }


        .info-card {
            min-height: 105px;
            background: #f5f7f9;
            border: 1px solid #e7eaee;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }


        .info-icon {
            font-size: 25px;
            margin-bottom: 7px;
        }


        .info-label {
            color: #707983;
            font-size: 15px;
            margin-bottom: 5px;
        }


        .info-value {
            font-size: 25px;
            font-weight: bold;
            color: #06182b;
        }



        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }


            .buttons button {
                min-height: 62px;
                border: none;
                border-radius: 17px;
                font-family: inherit;
                font-size: 17px;
                font-weight: bold;
                cursor: pointer;
                transition: 0.25s;
            }


        .restart {
            background: #ffc107;
            color: #06182b;
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.25);
        }


        .home {
            background: #06182b;
            color: white;
        }


        .buttons button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        }



        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .top-header {
                height: 72px;
                padding: 0 18px;
            }


            .brand-icon {
                width: 43px;
                height: 43px;
                font-size: 23px;
                border-radius: 13px;
            }


            .brand h1 {
                font-size: 21px;
            }


            .brand p {
                font-size: 11px;
            }


            .result-wrapper {
                padding: 25px 14px;
            }


            .result-card {
                padding: 30px 18px;
                border-radius: 25px;
            }


            .trophy {
                width: 82px;
                height: 82px;
                font-size: 42px;
            }


            .main-title {
                font-size: 24px;
            }


            .subtitle {
                font-size: 15px;
                margin-bottom: 25px;
            }


            .main-score {
                padding: 23px;
            }


            .score {
                font-size: 55px;
            }


                .score span {
                    font-size: 28px;
                }


            .info-grid {
                grid-template-columns: 1fr;
            }


            .info-card {
                min-height: 85px;
            }


            .buttons {
                grid-template-columns: 1fr;
            }


                .buttons button {
                    min-height: 57px;
                    font-size: 16px;
                }
        }
    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="top-header">

        <div class="brand">

            <div class="brand-icon">
                🚗
            </div>

            <div>

                <h1>
                    Driving Quiz
                </h1>

                <p>
                    ئەنجامی تاقیکردنەوە
                </p>

            </div>

        </div>

    </header>



    <!-- =========================
         RESULT
    ========================= -->

    <main class="result-wrapper">

        <section class="result-card">


            <!-- Trophy -->

            <div class="trophy">
                🏆
            </div>



            <!-- Title -->

            <h2 class="main-title">
                تاقیکردنەوەکەت تەواو بوو
            </h2>


            <p class="subtitle">
                ئەمە ئەنجامی تاقیکردنەوەکەتە
            </p>



            <!-- Score -->

            <div class="main-score">

                <div class="score-label">
                    نمرەی تۆ
                </div>

                <div class="score">

                    <span id="score">
                        0
                    </span>

                    <span>
                        /
                    </span>

                    <span id="total">
                        0
                    </span>

                </div>

            </div>



            <!-- Information -->

            <div class="info-grid">


                <!-- Percentage -->

                <div class="info-card">

                    <div class="info-icon">
                        📊
                    </div>

                    <div class="info-label">
                        ڕێژەی سەرکەوتن
                    </div>

                    <div class="info-value"
                         id="percentage">

                        0%

                    </div>

                </div>


                <!-- Total Questions -->

                <div class="info-card">

                    <div class="info-icon">
                        📝
                    </div>

                    <div class="info-label">
                        کۆی پرسیارەکان
                    </div>

                    <div class="info-value"
                         id="totalQuestions">

                        0

                    </div>

                </div>

            </div>



            <!-- Buttons -->

            <div class="buttons">

                <button class="restart"
                        onclick="restartQuiz()">

                    🔄 دووبارە دەست پێ بکە

                </button>


                <button class="home"
                        onclick="goHome()">

                    🏠 گەڕانەوە بۆ سەرەتا

                </button>

            </div>


        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        // =========================
        // GET RESULT
        // =========================

        const score =
            parseInt(
                localStorage.getItem("quizScore")
            ) || 0;


        const total =
            parseInt(
                localStorage.getItem("quizTotal")
            ) || 0;



        // =========================
        // SHOW SCORE
        // =========================

        document.getElementById(
            "score"
        ).textContent = score;


        document.getElementById(
            "total"
        ).textContent = total;


        document.getElementById(
            "totalQuestions"
        ).textContent = total;



        // =========================
        // CALCULATE PERCENTAGE
        // =========================

        let percentage = 0;


        if (total > 0) {

            percentage =
                Math.round(
                    (score / total) * 100
                );

        }


        document.getElementById(
            "percentage"
        ).textContent =
            percentage + "%";



        // =========================
        // RESTART QUIZ
        // =========================

        function restartQuiz() {

            localStorage.removeItem(
                "quizScore"
            );

            localStorage.removeItem(
                "quizTotal"
            );

            localStorage.removeItem(
                "quizUnanswered"
            );


            window.location.href =
                "quiz.html";
        }



        // =========================
        // GO HOME
        // =========================

        function goHome() {

            localStorage.removeItem(
                "quizScore"
            );

            localStorage.removeItem(
                "quizTotal"
            );

            localStorage.removeItem(
                "quizUnanswered"
            );


            window.location.href =
                "index.html";
        }

    </script>

</body>

</html>
